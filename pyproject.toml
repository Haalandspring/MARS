[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-rfi"
version = "0.1.0"
description = "Morphology-aware RFI segmentation and mask-guided mitigation for radio astronomy"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Zhaocheng Gong"},
  {name = "Jack White"},
  {name = "Jayanta Roy"},
  {name = "Wesley Armour"},
]
keywords = ["radio astronomy", "RFI", "segmentation", "PyTorch", "TensorRT"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
filterbank = [
  "sigpyproc @ git+https://github.com/FRBs/sigpyproc3@b31ef20fa13bb97e2caa244f65a4dfa377d6945a",
]
plots = ["matplotlib>=3.8", "pandas>=2.2", "scipy>=1.12"]
test = ["pytest>=8"]
onnx = ["onnx>=1.17", "onnxscript>=0.2"]

[project.urls]
Repository = "https://github.com/Haalandspring/MARS"

[project.scripts]
mars-train = "mars_rfi.training:main"
mars-mitigate = "mars_rfi.mitigate:main"
mars-export-tensorrt = "mars_rfi.export_tensorrt:main"
mars-presto = "mars_rfi.presto:main"
mars-diagnostics = "mars_rfi.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
