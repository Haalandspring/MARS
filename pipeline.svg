<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290" role="img" aria-labelledby="title desc">
  <title id="title">MARS RFI mitigation processing flow</title>
  <desc id="desc">Processing flow for the supplied config.json. An 8-bit SIGPROC filterbank is validated, its header retained, and its samples loaded to the GPU. Segments feed separate neural-input and science-sample branches. The neural branch uses median/MAD normalization, blank and negative handling, tanh compression, small-channel packing when needed, and 512 by 512 patches. PyTorch or verified TensorRT inference produces logits; thresholding with hysteresis produces masks, which are reconstructed in native segment coordinates. These masks are combined with channel flags before local-Gaussian replacement of the mean/std-normalized science samples. Post-replacement zero-DM projection, baseline removal, block rescaling and uint8 output follow. Segment reconstruction and replacement are performed together per segment; a complete observation-wide mask need not be stored.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#263238" />
    </marker>
    <style>text { font-family: "DejaVu Sans", Arial, sans-serif; } .flow { fill: none; stroke: #263238; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  <rect width="1800" height="1290" fill="white" />
  <text x="60" y="69" font-size="40" font-weight="700" text-anchor="start" fill="#263238">MARS</text>
  <text x="214" y="68" font-size="27" font-weight="400" text-anchor="start" fill="#263238">RFI mitigation processing flow</text>
  <text x="1740" y="67" font-size="21" font-weight="400" text-anchor="end" fill="#58626b">Default configuration</text>
  <line x1="60" y1="104" x2="1740" y2="104" stroke="#bcc2c7" stroke-width="1" />
  <g id="input-group">
    <rect x="60" y="180" width="1680" height="126" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
    <text x="60" y="151" font-size="25" font-weight="600" text-anchor="start" fill="#263238">(a)  Input and segment preparation</text>
  </g>
  <g id="mask-group">
    <rect x="60" y="420" width="1680" height="148" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
    <text x="60" y="391" font-size="25" font-weight="600" text-anchor="start" fill="#263238">(b)  Neural mask generation</text>
  </g>
  <g id="replacement-group">
    <rect x="60" y="706" width="1680" height="158" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
    <text x="60" y="677" font-size="25" font-weight="600" text-anchor="start" fill="#263238">(c)  Mask-guided replacement</text>
  </g>
  <g id="postprocessing-group">
    <rect x="60" y="986" width="1680" height="146" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
    <text x="60" y="957" font-size="25" font-weight="600" text-anchor="start" fill="#263238">(d)  Post-processing and output</text>
  </g>
  <path d="M1127.5 282 V337 H30 V781 H100" class="flow" marker-end="url(#arrow)" id="science-branch" />
  <path d="M30 492 H100" class="flow" marker-end="url(#arrow)" id="neural-input-branch" />
  <circle cx="30" cy="492" r="3.4" fill="#263238" />
  <text x="70" y="329" font-size="18" font-weight="400" text-anchor="start" fill="#58626b">Raw segment samples</text>
  <g id="input-filterbank">
    <rect x="100" y="204" width="310" height="78" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
    <text x="255.0" y="236.0" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">SIGPROC filterbank</text>
    <text x="255.0" y="266.0" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">8-bit · C × T samples</text>
  </g>
  <g id="validate-load">
    <rect x="510" y="204" width="330" height="78" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
    <text x="675.0" y="236.0" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Validate and load</text>
    <text x="675.0" y="266.0" font-size="17" font-weight="400" text-anchor="middle" fill="#263238">C ≥ 1 · retain header · GPU</text>
  </g>
  <g id="define-segments">
    <rect x="945" y="204" width="365" height="78" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
    <text x="1127.5" y="236.0" font-size="20" font-weight="600" text-anchor="middle" fill="#263238">Define processing segments</text>
    <text x="1127.5" y="266.0" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">4 s target · patch-aligned</text>
  </g>
  <g id="channel-flags">
    <rect x="1410" y="204" width="300" height="78" rx="9" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="1560.0" y="236.0" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Channel flags</text>
    <text x="1560.0" y="266.0" font-size="16" font-weight="400" text-anchor="middle" fill="#263238">Dead / saturated / persistent</text>
  </g>
  <path d="M410 243 H510" class="flow" marker-end="url(#arrow)" />
  <path d="M840 243 H945" class="flow" marker-end="url(#arrow)" />
  <path d="M1310 243 H1410" class="flow" marker-end="url(#arrow)" />
  <path d="M1560 282 V321 H1768 V781 H1710" class="flow" marker-end="url(#arrow)" stroke-dasharray="7 6" id="flags-to-combination" />
  <g id="robust-normalization">
    <rect x="100" y="440" width="240" height="104" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
    <text x="220.0" y="471" font-size="17.5" font-weight="600" text-anchor="middle" fill="#263238">Robust normalization</text>
    <text x="220.0" y="498" font-size="16" font-weight="400" text-anchor="middle" fill="#263238">Per-channel median / MAD</text>
    <text x="220.0" y="522" font-size="16" font-weight="400" text-anchor="middle" fill="#263238">with std fallback</text>
  </g>
  <path d="M340 492 H374" class="flow" marker-end="url(#arrow)" />
  <g id="condition-input">
    <rect x="374" y="440" width="240" height="104" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
    <text x="494.0" y="471" font-size="20" font-weight="600" text-anchor="middle" fill="#263238">Condition input</text>
    <text x="494.0" y="498" font-size="17" font-weight="400" text-anchor="middle" fill="#263238">Blank / negative handling</text>
    <text x="494.0" y="522" font-size="17" font-weight="400" text-anchor="middle" fill="#263238">tanh compression</text>
  </g>
  <path d="M614 492 H648" class="flow" marker-end="url(#arrow)" />
  <g id="build-patches">
    <rect x="648" y="440" width="240" height="104" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
    <text x="768.0" y="471" font-size="19" font-weight="600" text-anchor="middle" fill="#263238">Build model patches</text>
    <text x="768.0" y="498" font-size="16" font-weight="400" text-anchor="middle" fill="#263238">512 × 512 inputs</text>
    <text x="768.0" y="522" font-size="16" font-weight="400" text-anchor="middle" fill="#263238">Stack time slabs if C &lt; 512</text>
  </g>
  <path d="M888 492 H922" class="flow" marker-end="url(#arrow)" />
  <g id="model-inference">
    <rect x="922" y="440" width="240" height="104" rx="9" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
    <text x="1042.0" y="471" font-size="22" font-weight="600" text-anchor="middle" fill="#263238">MARS · FP16</text>
    <text x="1042.0" y="498" font-size="15.5" font-weight="400" text-anchor="middle" fill="#263238">PyTorch / verified TensorRT</text>
    <text x="1042.0" y="522" font-size="15.5" font-weight="400" text-anchor="middle" fill="#263238">Predict mask logits</text>
  </g>
  <path d="M1162 492 H1196" class="flow" marker-end="url(#arrow)" />
  <g id="threshold-hysteresis">
    <rect x="1196" y="440" width="240" height="104" rx="9" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
    <text x="1316.0" y="471" font-size="17" font-weight="600" text-anchor="middle" fill="#263238">Threshold + hysteresis</text>
    <text x="1316.0" y="498" font-size="16" font-weight="400" text-anchor="middle" fill="#263238">Seed 0.5 · support 0.15</text>
    <text x="1316.0" y="522" font-size="16" font-weight="400" text-anchor="middle" fill="#263238">Per-patch mask prediction</text>
  </g>
  <path d="M1436 492 H1470" class="flow" marker-end="url(#arrow)" />
  <g id="reconstruct-mask">
    <rect x="1470" y="440" width="240" height="104" rx="9" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
    <text x="1590.0" y="471" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Restore mask</text>
    <text x="1590.0" y="498" font-size="16.5" font-weight="400" text-anchor="middle" fill="#263238">Restore native C × T grid</text>
    <text x="1590.0" y="522" font-size="16.5" font-weight="400" text-anchor="middle" fill="#263238">Invert small-C packing</text>
  </g>
  <path d="M1590 544 V726" class="flow" marker-end="url(#arrow)" stroke-dasharray="7 6" id="neural-mask-to-combination" />
  <text x="1573" y="622" font-size="17" font-weight="400" text-anchor="end" fill="#58626b">Neural mask</text>
  <text x="1747" y="690" font-size="17" font-weight="400" text-anchor="end" fill="#58626b">Channel flags</text>
  <g id="science-preparation">
    <rect x="100" y="726" width="430" height="110" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
    <text x="315.0" y="757" font-size="22" font-weight="600" text-anchor="middle" fill="#263238">Prepare science samples</text>
    <text x="315.0" y="784" font-size="19" font-weight="400" text-anchor="middle" fill="#263238">Per-channel mean / std</text>
    <text x="315.0" y="808" font-size="19" font-weight="400" text-anchor="middle" fill="#263238">Retain native C × T coordinates</text>
  </g>
  <g id="mask-guided-replacement">
    <rect x="695" y="726" width="475" height="110" rx="9" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
    <text x="932.5" y="757" font-size="22" font-weight="600" text-anchor="middle" fill="#263238">Mask-guided replacement</text>
    <text x="932.5" y="784" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Local Gaussian fill from clean samples</text>
    <text x="932.5" y="808" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Fallback to normalized mean if needed</text>
  </g>
  <g id="combine-segment-mask">
    <rect x="1340" y="726" width="370" height="110" rx="9" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
    <text x="1525.0" y="757" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Combine segment masks</text>
    <text x="1525.0" y="784" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">NN + flagged channels</text>
    <text x="1525.0" y="808" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Channel occupancy flag &gt; 0.15</text>
  </g>
  <path d="M530 781 H695" class="flow" marker-end="url(#arrow)" id="science-to-replacement" />
  <text x="612.5" y="767" font-size="16" font-weight="400" text-anchor="middle" fill="#58626b">Science values</text>
  <path d="M1340 781 H1170" class="flow" marker-end="url(#arrow)" stroke-dasharray="7 6" id="mask-to-replacement" />
  <text x="1255" y="767" font-size="17" font-weight="400" text-anchor="middle" fill="#58626b">Mask</text>
  <path d="M932.5 836 V916 H30 V1059 H100" class="flow" marker-end="url(#arrow)" id="replacement-to-postprocessing" />
  <g id="zero-dm-projection">
    <rect x="100" y="1010" width="310" height="98" rx="9" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="255.0" y="1052.0" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Zero-DM projection</text>
    <text x="255.0" y="1082.0" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">zDot after replacement</text>
  </g>
  <g id="baseline-removal">
    <rect x="520" y="1010" width="310" height="98" rx="9" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="675.0" y="1052.0" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Baseline removal</text>
    <text x="675.0" y="1082.0" font-size="17" font-weight="400" text-anchor="middle" fill="#263238">1 s running-median window</text>
  </g>
  <g id="block-rescale">
    <rect x="940" y="1010" width="310" height="98" rx="9" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="1095.0" y="1052.0" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Block rescale → uint8</text>
    <text x="1095.0" y="1082.0" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Targets: μ = 128, σ = 6</text>
  </g>
  <g id="write-filterbank">
    <rect x="1360" y="1010" width="350" height="98" rx="9" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
    <text x="1535.0" y="1052.0" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Write cleaned filterbank</text>
    <text x="1535.0" y="1082.0" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Preserve SIGPROC header</text>
  </g>
  <path d="M410 1059 H520" class="flow" marker-end="url(#arrow)" />
  <path d="M830 1059 H940" class="flow" marker-end="url(#arrow)" />
  <path d="M1250 1059 H1360" class="flow" marker-end="url(#arrow)" />
  <path d="M80 1190 H156" class="flow" marker-end="url(#arrow)" />
  <text x="178" y="1196" font-size="19" font-weight="400" text-anchor="start" fill="#263238">Sample / prediction flow</text>
  <path d="M650 1190 H726" class="flow" marker-end="url(#arrow)" stroke-dasharray="7 6" />
  <text x="748" y="1196" font-size="19" font-weight="400" text-anchor="start" fill="#263238">Mask / flag dependency</text>
  <text x="60" y="1253" font-size="18" font-weight="400" text-anchor="start" fill="#58626b">C × T = channels × time. Segment masks are reconstructed and applied in the native science grid.</text>
  <text x="1740" y="1253" font-size="18" font-weight="400" text-anchor="end" fill="#58626b">Full observation remains GPU-resident.</text>
</svg>
