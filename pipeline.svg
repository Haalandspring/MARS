<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img" aria-labelledby="title desc">
  <title id="title">MARS RFI mitigation pipeline</title>
  <desc id="desc">The input filterbank is validated and loaded to the GPU. One branch generates and reconstructs the complete RFI mask, while a separate branch prepares the science samples. The mask is then applied during replacement, followed by zero-DM projection, baseline removal, block rescaling, and filterbank output.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="mask-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .lane-number { font: 700 38px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; opacity: 0.35; }
      .node-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-title-small { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-copy { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .tag { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; text-anchor: middle; letter-spacing: 0.5px; }
      .arrow { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 3.5; marker-end: url(#arrow); }
      .mask-link { fill: none; stroke: #7c3aed; stroke-width: 4; stroke-dasharray: 11 8; marker-end: url(#mask-arrow); }
    </style>
  </defs>

  <rect width="1800" height="950" rx="28" fill="url(#page)"/>
  <text x="55" y="58" class="title">MARS RFI mitigation pipeline</text>
  <text x="55" y="92" class="subtitle">Generate the complete RFI mask first, apply it to the science data, then run post-processing.</text>

  <!-- Swimlane backgrounds -->
  <rect x="35" y="125" width="1730" height="130" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="35" y="275" width="1730" height="200" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="35" y="495" width="1730" height="175" rx="22" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <rect x="35" y="690" width="1730" height="170" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>

  <!-- Swimlane labels -->
  <rect x="35" y="125" width="230" height="130" rx="22" fill="#334155"/>
  <rect x="35" y="275" width="230" height="200" rx="22" fill="#2563eb"/>
  <rect x="35" y="495" width="230" height="175" rx="22" fill="#7c3aed"/>
  <rect x="35" y="690" width="230" height="170" rx="22" fill="#059669"/>

  <text x="62" y="162" class="lane-number">01</text>
  <text x="62" y="201" class="lane-title">Input &amp;</text>
  <text x="62" y="230" class="lane-title">validation</text>

  <text x="62" y="317" class="lane-number">02</text>
  <text x="62" y="360" class="lane-title">RFI mask</text>
  <text x="62" y="389" class="lane-title">generation</text>

  <text x="62" y="537" class="lane-number">03</text>
  <text x="62" y="580" class="lane-title">Mask</text>
  <text x="62" y="609" class="lane-title">application</text>

  <text x="62" y="732" class="lane-number">04</text>
  <text x="62" y="775" class="lane-title">Post-</text>
  <text x="62" y="804" class="lane-title">processing</text>

  <!-- Input and validation -->
  <g filter="url(#shadow)">
    <rect x="335" y="145" width="280" height="90" rx="17" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="735" y="145" width="310" height="90" rx="17" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="1165" y="145" width="280" height="90" rx="17" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="475" y="182" class="node-title">SIGPROC filterbank</text>
  <text x="475" y="209" class="node-copy">uint8 · channels × time</text>
  <text x="890" y="182" class="node-title">Check &amp; preserve header</text>
  <text x="890" y="209" class="node-copy">8-bit input · C ≥ 512</text>
  <text x="1305" y="182" class="node-title">Load to GPU</text>
  <text x="1305" y="209" class="node-copy">create two working branches</text>
  <path d="M615 190 H725" class="arrow"/>
  <path d="M1045 190 H1155" class="arrow"/>

  <!-- Shared fork from the GPU input -->
  <path d="M1305 235 V265 H280 V582 H340" class="branch"/>
  <path d="M405 265 V315" class="branch"/>

  <!-- Complete RFI-mask generation -->
  <g filter="url(#shadow)">
    <rect x="300" y="325" width="210" height="105" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="545" y="325" width="210" height="105" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="790" y="325" width="200" height="105" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="1025" y="325" width="210" height="105" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="1270" y="325" width="230" height="105" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="1535" y="325" width="190" height="105" rx="17" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  </g>
  <text x="405" y="359" class="node-title-small">Segment + robust norm.</text>
  <text x="405" y="389" class="node-copy">per-channel median/MAD</text>
  <text x="405" y="412" class="node-copy">model-input branch</text>

  <text x="650" y="359" class="node-title-small">Input cleanup + tanh</text>
  <text x="650" y="389" class="node-copy">blank / negative handling</text>
  <text x="650" y="412" class="node-copy">bounded model input</text>

  <text x="890" y="365" class="node-title-small">512 × 512 patches</text>
  <text x="890" y="395" class="node-copy">split every segment</text>

  <text x="1130" y="365" class="node-title">MARS FP16</text>
  <text x="1130" y="395" class="node-copy">TensorRT inference</text>

  <text x="1385" y="359" class="node-title-small">Threshold + reconstruct</text>
  <text x="1385" y="389" class="node-copy">mask patches → segment</text>
  <text x="1385" y="412" class="node-copy">restore full dimensions</text>

  <text x="1630" y="358" class="node-title-small">Complete RFI mask</text>
  <text x="1630" y="386" class="node-copy">NN + flagged channels</text>
  <rect x="1568" y="400" width="124" height="20" rx="10" fill="#7c3aed"/>
  <text x="1630" y="415" class="tag">MASK READY</text>

  <path d="M510 377 H535" class="arrow"/>
  <path d="M755 377 H780" class="arrow"/>
  <path d="M990 377 H1015" class="arrow"/>
  <path d="M1235 377 H1260" class="arrow"/>
  <path d="M1500 377 H1525" class="arrow"/>

  <!-- Mask application: science values and completed mask meet here -->
  <g filter="url(#shadow)">
    <rect x="350" y="535" width="330" height="95" rx="17" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="915" y="535" width="350" height="95" rx="17" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  </g>
  <text x="515" y="571" class="node-title">Science-data preparation</text>
  <text x="515" y="600" class="node-copy">separate per-channel mean/std branch</text>
  <text x="1090" y="571" class="node-title">Mask-guided replacement</text>
  <text x="1090" y="600" class="node-copy">complete mask + science data · zero fill</text>
  <path d="M680 582 H905" class="arrow"/>
  <path d="M1630 430 V485 H1090 V525" class="mask-link"/>

  <!-- Serial post-processing after replacement -->
  <g filter="url(#shadow)">
    <rect x="325" y="730" width="250" height="90" rx="17" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="660" y="730" width="250" height="90" rx="17" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="995" y="730" width="250" height="90" rx="17" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="1330" y="730" width="330" height="90" rx="17" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
  </g>
  <text x="450" y="767" class="node-title">Zero-DM projection</text>
  <text x="450" y="794" class="node-copy">zDot after replacement</text>
  <text x="785" y="767" class="node-title">Baseline removal</text>
  <text x="785" y="794" class="node-copy">1 s time window</text>
  <text x="1120" y="767" class="node-title">Block rescale</text>
  <text x="1120" y="794" class="node-copy">uint8 · μ=128 · σ=6</text>
  <text x="1495" y="767" class="node-title">Write cleaned filterbank</text>
  <text x="1495" y="794" class="node-copy">preserved SIGPROC header</text>
  <path d="M1090 630 V700 H450 V720" class="arrow"/>
  <path d="M575 775 H650" class="arrow"/>
  <path d="M910 775 H985" class="arrow"/>
  <path d="M1245 775 H1320" class="arrow"/>

  <!-- Compact legend -->
  <line x1="430" y1="905" x2="505" y2="905" stroke="#334155" stroke-width="4"/>
  <text x="620" y="911" class="node-copy">science-data flow</text>
  <line x1="850" y1="905" x2="925" y2="905" stroke="#7c3aed" stroke-width="4" stroke-dasharray="11 8"/>
  <text x="1105" y="911" class="node-copy">completed mask controls replacement</text>
</svg>
