<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">MARS TRTShapeUNet512 architecture</title>
  <desc id="desc">A U-shaped encoder-decoder architecture with a morphology-aware bottleneck, additive skip connections, and horizontal and vertical decoder refinement.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="context" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="skip-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .section { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; text-anchor: middle; letter-spacing: 1px; }
      .stage-title { font: 700 21px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .stage-copy { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .shape { font: 700 16px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .pill { font: 700 14px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .small { font: 600 15px Inter, "Segoe UI", Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .explainer-title { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .arrow { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .skip { fill: none; stroke: #d97706; stroke-width: 4; stroke-dasharray: 12 8; marker-end: url(#skip-arrow); }
    </style>
  </defs>

  <rect width="1800" height="1120" rx="28" fill="url(#page)"/>
  <text x="60" y="62" class="title">MARS morphology-aware segmentation model</text>
  <text x="60" y="98" class="subtitle">TRTShapeUNet512 · 270,769 trainable parameters · FP16 TensorRT-friendly operators</text>

  <!-- Section headers -->
  <rect x="235" y="125" width="300" height="46" rx="23" fill="#dbeafe"/>
  <text x="385" y="155" class="section">ENCODER</text>
  <rect x="650" y="895" width="500" height="46" rx="23" fill="#ede9fe"/>
  <text x="900" y="925" class="section">MORPHOLOGY BOTTLENECK</text>
  <rect x="1265" y="125" width="300" height="46" rx="23" fill="#dcfce7"/>
  <text x="1415" y="155" class="section">DECODER</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="35" y="210" width="165" height="112" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="117" y="248" class="stage-title">Input patch</text>
  <text x="117" y="278" class="stage-copy">normalized FP16</text>
  <rect x="61" y="292" width="112" height="22" rx="11" fill="#334155"/>
  <text x="117" y="308" class="shape">1 × 512²</text>

  <!-- Encoder stages -->
  <g filter="url(#shadow)">
    <rect x="260" y="200" width="250" height="132" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="260" y="390" width="250" height="132" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="260" y="580" width="250" height="132" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="260" y="770" width="250" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  </g>
  <text x="385" y="235" class="stage-title">Stem · S0</text>
  <text x="385" y="264" class="stage-copy">3×3 Conv · BN · ReLU</text>
  <rect x="326" y="288" width="118" height="26" rx="13" fill="#2563eb"/>
  <text x="385" y="307" class="shape">8 × 512²</text>

  <text x="385" y="425" class="stage-title">Down 1 · S1</text>
  <text x="385" y="454" class="stage-copy">stride-2 3×3 Conv</text>
  <rect x="321" y="478" width="128" height="26" rx="13" fill="#2563eb"/>
  <text x="385" y="497" class="shape">16 × 256²</text>

  <text x="385" y="615" class="stage-title">Down 2 · S2</text>
  <text x="385" y="644" class="stage-copy">stride-2 3×3 Conv</text>
  <rect x="321" y="668" width="128" height="26" rx="13" fill="#2563eb"/>
  <text x="385" y="687" class="shape">32 × 128²</text>

  <text x="385" y="805" class="stage-title">Down 3</text>
  <text x="385" y="834" class="stage-copy">stride-2 3×3 Conv</text>
  <rect x="326" y="846" width="118" height="26" rx="13" fill="#2563eb"/>
  <text x="385" y="865" class="shape">64 × 64²</text>

  <!-- Encoder arrows -->
  <path d="M200 266 H250" class="arrow"/>
  <path d="M385 332 V380" class="arrow"/>
  <path d="M385 522 V570" class="arrow"/>
  <path d="M385 712 V760" class="arrow"/>

  <!-- Bottleneck -->
  <g filter="url(#shadow)">
    <rect x="600" y="735" width="600" height="145" rx="22" fill="url(#context)" stroke="#7c3aed" stroke-width="3"/>
    <rect x="625" y="780" width="145" height="58" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="790" y="780" width="145" height="58" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="955" y="780" width="145" height="58" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1120" y="780" width="55" height="58" rx="14" fill="#7c3aed"/>
  </g>
  <text x="900" y="766" class="stage-title">Parallel RFI shape context · 64 channels</text>
  <text x="697" y="805" class="stage-title">Local</text>
  <text x="697" y="827" class="stage-copy">3 × 3</text>
  <text x="862" y="805" class="stage-title">Horizontal</text>
  <text x="862" y="827" class="stage-copy">1 × 9</text>
  <text x="1027" y="805" class="stage-title">Vertical</text>
  <text x="1027" y="827" class="stage-copy">9 × 1</text>
  <text x="1147" y="805" class="shape">1×1</text>
  <text x="1147" y="827" class="shape">+res</text>
  <path d="M510 825 H590" class="arrow"/>

  <!-- Decoder stages -->
  <g filter="url(#shadow)">
    <rect x="1290" y="580" width="280" height="140" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <rect x="1290" y="390" width="280" height="140" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <rect x="1290" y="200" width="280" height="140" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  </g>

  <text x="1430" y="611" class="stage-title">Up 2 + S2</text>
  <text x="1430" y="637" class="stage-copy">nearest up · additive skip</text>
  <rect x="1315" y="655" width="105" height="25" rx="12" fill="#0891b2"/>
  <rect x="1430" y="655" width="115" height="25" rx="12" fill="#7c3aed"/>
  <text x="1367" y="673" class="pill">H 1×31</text>
  <text x="1487" y="673" class="pill">V 31×1</text>
  <rect x="1366" y="690" width="128" height="22" rx="11" fill="#059669"/>
  <text x="1430" y="706" class="shape">32 × 128²</text>

  <text x="1430" y="421" class="stage-title">Up 1 + S1</text>
  <text x="1430" y="447" class="stage-copy">nearest up · additive skip</text>
  <rect x="1315" y="465" width="105" height="25" rx="12" fill="#0891b2"/>
  <rect x="1430" y="465" width="115" height="25" rx="12" fill="#7c3aed"/>
  <text x="1367" y="483" class="pill">H 1×31</text>
  <text x="1487" y="483" class="pill">V 31×1</text>
  <rect x="1366" y="500" width="128" height="22" rx="11" fill="#059669"/>
  <text x="1430" y="516" class="shape">16 × 256²</text>

  <text x="1430" y="231" class="stage-title">Up 0 + S0</text>
  <text x="1430" y="257" class="stage-copy">nearest up · additive skip</text>
  <rect x="1315" y="275" width="105" height="25" rx="12" fill="#0891b2"/>
  <rect x="1430" y="275" width="115" height="25" rx="12" fill="#7c3aed"/>
  <text x="1367" y="293" class="pill">H 1×31</text>
  <text x="1487" y="293" class="pill">V 31×1</text>
  <rect x="1371" y="310" width="118" height="22" rx="11" fill="#059669"/>
  <text x="1430" y="326" class="shape">8 × 512²</text>

  <!-- Decoder flow -->
  <path d="M1200 807 H1245 V650 H1280" class="arrow"/>
  <path d="M1430 580 V540" class="arrow"/>
  <path d="M1430 390 V350" class="arrow"/>

  <!-- Skip connections -->
  <path d="M510 266 H1260 Q1275 266 1280 266" class="skip"/>
  <path d="M510 456 H1260 Q1275 456 1280 456" class="skip"/>
  <path d="M510 646 H1260 Q1275 646 1280 646" class="skip"/>
  <rect x="810" y="238" width="170" height="28" rx="14" fill="#fff7ed" stroke="#d97706"/>
  <rect x="810" y="428" width="170" height="28" rx="14" fill="#fff7ed" stroke="#d97706"/>
  <rect x="810" y="618" width="170" height="28" rx="14" fill="#fff7ed" stroke="#d97706"/>
  <text x="895" y="258" class="small" fill="#b45309">additive skip S0</text>
  <text x="895" y="448" class="small" fill="#b45309">additive skip S1</text>
  <text x="895" y="638" class="small" fill="#b45309">additive skip S2</text>

  <!-- Head and output -->
  <g filter="url(#shadow)">
    <rect x="1610" y="200" width="155" height="140" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  </g>
  <text x="1687" y="233" class="stage-title">Head</text>
  <text x="1687" y="262" class="stage-copy">1 × 1 Conv</text>
  <text x="1687" y="287" class="stage-copy">logits → threshold</text>
  <rect x="1627" y="304" width="120" height="26" rx="13" fill="#0f766e"/>
  <text x="1687" y="323" class="shape">binary mask</text>
  <path d="M1570 270 H1600" class="arrow"/>

  <!-- Decoder refinement explainer -->
  <rect x="1235" y="960" width="520" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1495" y="993" class="explainer-title">Every decoder stage performs two residual refinements</text>
  <rect x="1270" y="1012" width="215" height="34" rx="17" fill="#0891b2"/>
  <rect x="1505" y="1012" width="215" height="34" rx="17" fill="#7c3aed"/>
  <text x="1377" y="1035" class="pill">horizontal: 1×31 → 3×3</text>
  <text x="1612" y="1035" class="pill">vertical: 31×1 → 3×3</text>

  <!-- Legend -->
  <rect x="55" y="1010" width="18" height="18" rx="4" fill="#2563eb"/>
  <text x="180" y="1025" class="small">encoder Conv-BN-ReLU</text>
  <rect x="315" y="1010" width="18" height="18" rx="4" fill="#7c3aed"/>
  <text x="435" y="1025" class="small">shape-aware context</text>
  <rect x="570" y="1010" width="18" height="18" rx="4" fill="#059669"/>
  <text x="695" y="1025" class="small">full-resolution decoder</text>
  <line x1="55" y1="1065" x2="130" y2="1065" stroke="#d97706" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="240" y="1071" class="small">additive skip connection</text>
</svg>
