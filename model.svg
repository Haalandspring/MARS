<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290" role="img" aria-labelledby="title desc">
  <title id="title">MARS morphology-aware segmentation network</title>
  <desc id="desc">Paper-style block diagram of the 270,769-parameter TRTShapeUNet512. Panel a shows an encoder with channel widths 8, 16, 32 and 64, three decoder stages with additive skip connections, and a 1 by 1 convolution producing logits. Panel b expands the residual morphology context: parallel 3 by 3, 1 by 9 and 9 by 1 Conv-BatchNorm-ReLU branches, channel concatenation, a 1 by 1 Conv-BatchNorm-ReLU fusion, and residual addition. Panel c expands the horizontal and vertical residual refinements, applied sequentially at all three decoder stages. The model is a convolutional encoder-decoder; the figure uses the visual style of classic Transformer architecture diagrams.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#263238" />
    </marker>
    <style>text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #20282e; } .flow { fill: none; stroke: #263238; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  <rect width="1800" height="1290" fill="white" />
  <text x="60" y="69" font-size="40" font-weight="700" text-anchor="start" fill="#263238">MARS</text>
  <text x="214" y="68" font-size="27" font-weight="400" text-anchor="start" fill="#263238">Morphology-aware RFI segmentation</text>
  <text x="1740" y="67" font-size="21" font-weight="400" text-anchor="end" fill="#58626b">270,769 trainable parameters</text>
  <line x1="60" y1="104" x2="1740" y2="104" stroke="#bcc2c7" stroke-width="1" />
  <text x="60" y="151" font-size="25" font-weight="600" text-anchor="start" fill="#263238">(a)  Multi-scale encoder–decoder</text>
  <text x="1020" y="151" font-size="25" font-weight="600" text-anchor="start" fill="#263238">(b)  Morphology context</text>
  <g id="encoder-decoder">
    <rect x="108" y="305" width="314" height="861" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
    <rect x="625" y="248" width="330" height="710" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
    <text x="108" y="292" font-size="22" font-weight="600" text-anchor="start" fill="#263238">Encoder</text>
    <text x="625" y="989" font-size="22" font-weight="600" text-anchor="start" fill="#263238">Decoder</text>
    <text x="265" y="195" font-size="22" font-weight="400" text-anchor="middle" fill="#263238">Normalized input</text>
    <text x="265" y="225" font-size="20" font-weight="400" text-anchor="middle" fill="#58626b">1 × 512 × 512</text>
    <path d="M265 239 V326" class="flow" marker-end="url(#arrow)" />
    <text x="790" y="179" font-size="22" font-weight="400" text-anchor="middle" fill="#263238">RFI logits</text>
    <text x="790" y="206" font-size="19" font-weight="400" text-anchor="middle" fill="#58626b">1 × 512 × 512</text>
    <rect x="660" y="220" width="260" height="44" rx="8" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="790.0" y="249.0" font-size="20" font-weight="400" text-anchor="middle" fill="#263238">1 × 1 Conv</text>
    <path d="M790 220 V211" class="flow" marker-end="url(#arrow)" />
    <g id="stem">
      <rect x="140" y="326" width="250" height="100" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
      <text x="265" y="355" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Stem</text>
      <text x="265" y="383" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">3 × 3 CBR · stride 1</text>
      <text x="265" y="410" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">8 × 512 × 512</text>
    </g>
    <path d="M265 426 V566" class="flow" marker-end="url(#arrow)" />
    <g id="down1">
      <rect x="140" y="566" width="250" height="100" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
      <text x="265" y="595" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Down 1</text>
      <text x="265" y="623" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">3 × 3 CBR · stride 2</text>
      <text x="265" y="650" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">16 × 256 × 256</text>
    </g>
    <path d="M265 666 V806" class="flow" marker-end="url(#arrow)" />
    <g id="down2">
      <rect x="140" y="806" width="250" height="100" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
      <text x="265" y="835" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Down 2</text>
      <text x="265" y="863" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">3 × 3 CBR · stride 2</text>
      <text x="265" y="890" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">32 × 128 × 128</text>
    </g>
    <path d="M265 906 V1046" class="flow" marker-end="url(#arrow)" />
    <g id="down3">
      <rect x="140" y="1046" width="250" height="100" rx="9" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
      <text x="265" y="1075" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Down 3</text>
      <text x="265" y="1103" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">3 × 3 CBR · stride 2</text>
      <text x="265" y="1130" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">64 × 64 × 64</text>
    </g>
    <g id="decoder-stage-0">
      <rect x="640" y="278" width="300" height="190" rx="11" fill="white" stroke="#263238" stroke-width="1.5" />
      <text x="790" y="303" font-size="18" font-weight="600" text-anchor="middle" fill="#263238">D0  ·  8 × 512 × 512</text>
      <rect x="656" y="318" width="268" height="34" rx="8" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="341.3" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">H refine → V refine  (c)</text>
      <rect x="656" y="359" width="268" height="34" rx="8" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="382.3" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Add skip → 3 × 3 CBR</text>
      <rect x="656" y="415" width="268" height="34" rx="8" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="437.95" font-size="17" font-weight="400" text-anchor="middle" fill="#263238">Nearest ↑2 → 1 × 1 Conv</text>
      <path d="M790 359 V352" class="flow" marker-end="url(#arrow)" />
      <path d="M790 415 V393" class="flow" marker-end="url(#arrow)" />
    </g>
    <path d="M390 376 H656" class="flow" marker-end="url(#arrow)" />
    <text x="519" y="363" font-size="23" font-weight="500" text-anchor="middle" fill="#263238">s₀</text>
    <path d="M790 278 V264" class="flow" marker-end="url(#arrow)" />
    <g id="decoder-stage-1">
      <rect x="640" y="518" width="300" height="190" rx="11" fill="white" stroke="#263238" stroke-width="1.5" />
      <text x="790" y="543" font-size="18" font-weight="600" text-anchor="middle" fill="#263238">D1  ·  16 × 256 × 256</text>
      <rect x="656" y="558" width="268" height="34" rx="8" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="581.3" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">H refine → V refine  (c)</text>
      <rect x="656" y="599" width="268" height="34" rx="8" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="622.3" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Add skip → 3 × 3 CBR</text>
      <rect x="656" y="655" width="268" height="34" rx="8" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="677.95" font-size="17" font-weight="400" text-anchor="middle" fill="#263238">Nearest ↑2 → 1 × 1 Conv</text>
      <path d="M790 599 V592" class="flow" marker-end="url(#arrow)" />
      <path d="M790 655 V633" class="flow" marker-end="url(#arrow)" />
    </g>
    <path d="M390 616 H656" class="flow" marker-end="url(#arrow)" />
    <text x="519" y="603" font-size="23" font-weight="500" text-anchor="middle" fill="#263238">s₁</text>
    <path d="M790 518 V468" class="flow" marker-end="url(#arrow)" />
    <g id="decoder-stage-2">
      <rect x="640" y="758" width="300" height="190" rx="11" fill="white" stroke="#263238" stroke-width="1.5" />
      <text x="790" y="783" font-size="18" font-weight="600" text-anchor="middle" fill="#263238">D2  ·  32 × 128 × 128</text>
      <rect x="656" y="798" width="268" height="34" rx="8" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="821.3" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">H refine → V refine  (c)</text>
      <rect x="656" y="839" width="268" height="34" rx="8" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="862.3" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Add skip → 3 × 3 CBR</text>
      <rect x="656" y="895" width="268" height="34" rx="8" fill="#dceaf3" stroke="#263238" stroke-width="1.5" />
      <text x="790.0" y="917.95" font-size="17" font-weight="400" text-anchor="middle" fill="#263238">Nearest ↑2 → 1 × 1 Conv</text>
      <path d="M790 839 V832" class="flow" marker-end="url(#arrow)" />
      <path d="M790 895 V873" class="flow" marker-end="url(#arrow)" />
    </g>
    <path d="M390 856 H656" class="flow" marker-end="url(#arrow)" />
    <text x="519" y="843" font-size="23" font-weight="500" text-anchor="middle" fill="#263238">s₂</text>
    <path d="M790 758 V708" class="flow" marker-end="url(#arrow)" />
    <g id="context-summary">
      <rect x="505" y="1046" width="435" height="100" rx="10" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
      <text x="722.5" y="1078" font-size="22" font-weight="600" text-anchor="middle" fill="#263238">Morphology context  (b)</text>
      <text x="722.5" y="1107" font-size="19" font-weight="400" text-anchor="middle" fill="#263238">Parallel branches + residual</text>
      <text x="722.5" y="1133" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">64 × 64 × 64</text>
    </g>
    <path d="M390 1096 H505" class="flow" marker-end="url(#arrow)" />
    <path d="M790 1046 V948" class="flow" marker-end="url(#arrow)" />
  </g>
  <g id="morphology-context-detail">
    <rect x="1020" y="229" width="730" height="431" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
    <text x="1365" y="210" font-size="19" font-weight="400" text-anchor="middle" fill="#58626b">64 × 64 × 64</text>
    <rect x="1225" y="251" width="280" height="46" rx="8" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
    <text x="1365.0" y="281.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">Add</text>
    <path d="M1365 251 V220" class="flow" marker-end="url(#arrow)" />
    <rect x="1225" y="331" width="280" height="54" rx="8" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="1365.0" y="365.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">1 × 1 CBR</text>
    <path d="M1365 331 V297" class="flow" marker-end="url(#arrow)" />
    <rect x="1080" y="423" width="570" height="46" rx="8" fill="#e5def2" stroke="#263238" stroke-width="1.5" />
    <text x="1365.0" y="453.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">Concatenate channels</text>
    <path d="M1365 423 V385" class="flow" marker-end="url(#arrow)" />
    <text x="1450" y="408" font-size="16" font-weight="400" text-anchor="start" fill="#58626b">192 channels</text>
    <rect x="1080" y="512" width="170" height="62" rx="8" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="1165" y="535" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Local</text>
    <text x="1165" y="560" font-size="20" font-weight="400" text-anchor="middle" fill="#263238">3 × 3 CBR</text>
    <path d="M1165 512 V469" class="flow" marker-end="url(#arrow)" />
    <path d="M1165 605 V574" class="flow" marker-end="url(#arrow)" />
    <rect x="1280" y="512" width="170" height="62" rx="8" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="1365" y="535" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Horizontal</text>
    <text x="1365" y="560" font-size="20" font-weight="400" text-anchor="middle" fill="#263238">1 × 9 CBR</text>
    <path d="M1365 512 V469" class="flow" marker-end="url(#arrow)" />
    <path d="M1365 605 V574" class="flow" marker-end="url(#arrow)" />
    <rect x="1480" y="512" width="170" height="62" rx="8" fill="#f5dfbc" stroke="#263238" stroke-width="1.5" />
    <text x="1565" y="535" font-size="18" font-weight="400" text-anchor="middle" fill="#263238">Vertical</text>
    <text x="1565" y="560" font-size="20" font-weight="400" text-anchor="middle" fill="#263238">9 × 1 CBR</text>
    <path d="M1565 512 V469" class="flow" marker-end="url(#arrow)" />
    <path d="M1565 605 V574" class="flow" marker-end="url(#arrow)" />
    <path d="M1165 605 H1565" class="flow" />
    <path d="M1365 668 V605" class="flow" />
    <circle cx="1365" cy="642" r="3.4" fill="#263238" />
    <path d="M1365 642 H1717 V274 H1505" class="flow" marker-end="url(#arrow)" />
    <text x="1365" y="698" font-size="19" font-weight="400" text-anchor="middle" fill="#263238">Input: 64 × 64 × 64</text>
  </g>
  <g id="decoder-residual-refinement-details">
    <text x="1020" y="744" font-size="25" font-weight="600" text-anchor="start" fill="#263238">(c)  Decoder refinements</text>
    <text x="1020" y="777" font-size="19" font-weight="400" text-anchor="start" fill="#58626b">Horizontal then vertical, at each decoder scale.</text>
    <g id="horizontal-residual">
      <text x="1200" y="821" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Horizontal</text>
      <rect x="1030" y="844" width="340" height="320" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
      <rect x="1075" y="877" width="240" height="46" rx="8" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
      <text x="1195.0" y="907.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">Add</text>
      <path d="M1200 877 V833" class="flow" marker-end="url(#arrow)" />
      <rect x="1075" y="975" width="240" height="52" rx="8" fill="#f4d8d5" stroke="#263238" stroke-width="1.5" />
      <text x="1195.0" y="1008.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">3 × 3 CBR</text>
      <path d="M1200 975 V923" class="flow" marker-end="url(#arrow)" />
      <rect x="1075" y="1073" width="240" height="52" rx="8" fill="#f4d8d5" stroke="#263238" stroke-width="1.5" />
      <text x="1195.0" y="1106.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">1 × 31 CBR</text>
      <path d="M1200 1073 V1027" class="flow" marker-end="url(#arrow)" />
      <path d="M1200 1189 V1125" class="flow" marker-end="url(#arrow)" />
      <circle cx="1200" cy="1150" r="3.4" fill="#263238" />
      <path d="M1200 1150 H1347 V900 H1315" class="flow" marker-end="url(#arrow)" />
      <text x="1200" y="1217" font-size="20" font-weight="400" text-anchor="middle" fill="#263238">C × F × T</text>
    </g>
    <g id="vertical-residual">
      <text x="1590" y="821" font-size="21" font-weight="600" text-anchor="middle" fill="#263238">Vertical</text>
      <rect x="1420" y="844" width="340" height="320" rx="20" fill="#f6f6f6" stroke="#263238" stroke-width="1.2" />
      <rect x="1465" y="877" width="240" height="46" rx="8" fill="#dfebce" stroke="#263238" stroke-width="1.5" />
      <text x="1585.0" y="907.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">Add</text>
      <path d="M1590 877 V833" class="flow" marker-end="url(#arrow)" />
      <rect x="1465" y="975" width="240" height="52" rx="8" fill="#dce8f0" stroke="#263238" stroke-width="1.5" />
      <text x="1585.0" y="1008.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">3 × 3 CBR</text>
      <path d="M1590 975 V923" class="flow" marker-end="url(#arrow)" />
      <rect x="1465" y="1073" width="240" height="52" rx="8" fill="#dce8f0" stroke="#263238" stroke-width="1.5" />
      <text x="1585.0" y="1106.35" font-size="21" font-weight="400" text-anchor="middle" fill="#263238">31 × 1 CBR</text>
      <path d="M1590 1073 V1027" class="flow" marker-end="url(#arrow)" />
      <path d="M1590 1189 V1125" class="flow" marker-end="url(#arrow)" />
      <circle cx="1590" cy="1150" r="3.4" fill="#263238" />
      <path d="M1590 1150 H1737 V900 H1705" class="flow" marker-end="url(#arrow)" />
      <text x="1590" y="1217" font-size="20" font-weight="400" text-anchor="middle" fill="#263238">C × F × T</text>
    </g>
  </g>
  <text x="60" y="1220" font-size="20" font-weight="500" text-anchor="start" fill="#263238">CBR = Conv2D → BatchNorm → ReLU</text>
  <text x="60" y="1253" font-size="18" font-weight="400" text-anchor="start" fill="#58626b">Shapes: channels × frequency × time. Kernels: frequency × time.</text>
  <text x="1740" y="1253" font-size="18" font-weight="400" text-anchor="end" fill="#58626b">C = 32, 16, 8 for D2, D1, D0</text>
</svg>
